<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex subscriptions</title>
  <style>
    :root { color-scheme: light dark; font: 15px/1.45 system-ui, sans-serif; }
    body { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; background: Canvas; color: CanvasText; }
    header, .row, .actions { display: flex; align-items: center; gap: 12px; }
    header, .row { justify-content: space-between; }
    h1 { margin: 0; font-size: 24px; }
    p { color: GrayText; }
    button, input { font: inherit; }
    button { padding: 8px 12px; border: 1px solid ButtonBorder; border-radius: 8px; background: ButtonFace; color: ButtonText; cursor: pointer; }
    button.primary { background: #0a66ff; border-color: #0a66ff; color: white; }
    button:disabled { cursor: wait; opacity: .6; }
    form { display: flex; gap: 8px; margin: 24px 0; }
    input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid ButtonBorder; border-radius: 8px; background: Field; color: FieldText; }
    #accounts { display: grid; gap: 12px; }
    article { padding: 16px; border: 1px solid ButtonBorder; border-radius: 12px; }
    article h2 { margin: 0; font-size: 17px; }
    .meta { margin: 4px 0 0; font-size: 13px; color: GrayText; overflow-wrap: anywhere; }
    .badge { padding: 2px 7px; border-radius: 999px; font-size: 12px; background: color-mix(in srgb, CanvasText 10%, transparent); }
    .error { color: #d93025; }
    #login { margin: 16px 0; padding: 14px; border-radius: 10px; background: color-mix(in srgb, #0a66ff 12%, Canvas); }
    #login[hidden], #status:empty { display: none; }
    code { font-size: 20px; letter-spacing: .12em; user-select: all; }
    label { display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <header><div><h1>Codex subscriptions</h1><p>Manage the local account pool used for new chats.</p></div><button id="refresh" type="button">Refresh</button></header>
  <p id="status" role="status"></p>
  <section id="login" hidden aria-live="polite"></section>
  <form id="add"><input id="label" type="text" maxlength="80" placeholder="Subscription label (optional)" aria-label="Subscription label"><button class="primary" type="submit">Add subscription</button></form>
  <main id="accounts" aria-live="polite"></main>
  <script>
    const params = new URLSearchParams(location.hash.slice(1));
    const suppliedToken = params.get("token");
    if (suppliedToken) {
      sessionStorage.setItem("codexMuxToken", suppliedToken);
      history.replaceState(null, "", location.pathname);
    }
    const token = suppliedToken || sessionStorage.getItem("codexMuxToken");
    const accountsNode = document.querySelector("#accounts");
    const statusNode = document.querySelector("#status");
    const loginNode = document.querySelector("#login");

    function element(name, text, className) {
      const node = document.createElement(name);
      if (text != null) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    async function request(path, options = {}) {
      if (!token) throw new Error("Open this page from the Manage Codex Subscriptions shortcut.");
      const response = await fetch(`/v1${path}`, {
        ...options,
        headers: { "Content-Type": "application/json", "X-Codex-Mux-Token": token, ...(options.headers || {}) },
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || `Request failed (${response.status})`);
      return body;
    }

    function quota(account) {
      const windows = [account.rateLimits?.primary, account.rateLimits?.secondary].filter(Boolean);
      if (!windows.length) return "Usage unavailable";
      return windows.map(item => `${Math.round(item.usedPercent || 0)}% used`).join(" · ");
    }

    function maskedEmail(value) {
      const at = value ? value.indexOf("@") : -1;
      if (at < 1) return value || "";
      return `${value.slice(0, Math.min(2, at))}…${value.slice(at)}`;
    }

    function render(accounts) {
      accountsNode.replaceChildren();
      for (const account of accounts) {
        const card = element("article");
        const top = element("div", null, "row");
        const title = element("div");
        title.append(element("h2", account.label), element("div", [account.planLabel, maskedEmail(account.email)].filter(Boolean).join(" · ") || "Not signed in", "meta"));
        top.append(title, element("span", account.connected ? "Connected" : "Disconnected", "badge"));

        const detail = element("p", `${quota(account)} · ${account.threadCount || 0} chats`, "meta");
        const actions = element("div", null, "actions");
        const toggleLabel = element("label");
        const toggle = document.createElement("input");
        toggle.type = "checkbox";
        toggle.checked = account.enabled;
        toggle.addEventListener("change", async () => {
          toggle.disabled = true;
          try { await request(`/accounts/${encodeURIComponent(account.id)}`, { method: "PATCH", body: JSON.stringify({ enabled: toggle.checked }) }); await load(); }
          catch (error) { showError(error); toggle.checked = !toggle.checked; }
          finally { toggle.disabled = false; }
        });
        toggleLabel.append(toggle, "Enabled");
        actions.append(toggleLabel);
        if (!account.connected) {
          const signIn = element("button", "Sign in");
          signIn.type = "button";
          signIn.addEventListener("click", () => startLogin(account.id, signIn));
          actions.append(signIn);
        }
        card.append(top, detail, actions);
        if (account.error) card.append(element("p", account.error, "meta error"));
        accountsNode.append(card);
      }
    }

    function trustedVerificationURL(raw) {
      try {
        const url = new URL(raw);
        const host = url.hostname.toLowerCase();
        return url.protocol === "https:" && (host === "openai.com" || host.endsWith(".openai.com") || host === "chatgpt.com" || host.endsWith(".chatgpt.com")) ? url.href : null;
      } catch { return null; }
    }

    async function startLogin(accountId, button) {
      button.disabled = true;
      try {
        const result = await request(`/accounts/${encodeURIComponent(accountId)}/login`, { method: "POST", body: JSON.stringify({ mode: "chatgptDeviceCode" }) });
        const login = result.login || {};
        const url = trustedVerificationURL(login.verificationUrl || login.authUrl || "");
        loginNode.replaceChildren(element("strong", "Complete sign-in"));
        if (login.userCode) loginNode.append(element("p", "Copy this code:"), element("code", login.userCode));
        if (url) {
          const open = element("button", "Open verification page", "primary");
          open.type = "button";
          open.addEventListener("click", () => window.open(url, "_blank", "noopener"));
          loginNode.append(element("p", "The account list refreshes automatically after sign-in."), open);
        }
        if (login.userCode && navigator.clipboard) navigator.clipboard.writeText(login.userCode).catch(() => {});
        loginNode.hidden = false;
      } catch (error) { showError(error); }
      finally { button.disabled = false; }
    }

    async function load() {
      statusNode.textContent = "Loading…";
      statusNode.className = "";
      try { const result = await request("/accounts"); render(result.accounts || []); statusNode.textContent = ""; }
      catch (error) { showError(error); }
    }

    function showError(error) {
      statusNode.textContent = error instanceof Error ? error.message : String(error);
      statusNode.className = "error";
    }

    document.querySelector("#refresh").addEventListener("click", load);
    document.querySelector("#add").addEventListener("submit", async event => {
      event.preventDefault();
      const button = event.submitter;
      button.disabled = true;
      try {
        const result = await request("/accounts", { method: "POST", body: JSON.stringify({ label: document.querySelector("#label").value }) });
        document.querySelector("#label").value = "";
        await load();
        await startLogin(result.account.id, button);
      } catch (error) { showError(error); }
      finally { button.disabled = false; }
    });
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
